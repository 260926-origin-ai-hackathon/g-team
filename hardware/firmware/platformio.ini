[platformio]
default_envs = m5stack-core2

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit VL53L5CX

; 配線確認用: pio run -e diag -t upload
[env:diag]
extends = env:m5stack-core2
build_src_filter = -<*> +<../diag/i2c_diag.cpp>

; ToF 切り分け用: pio run -e tofdiag -t upload
[env:tofdiag]
extends = env:m5stack-core2
build_src_filter = -<*> +<../diag/tof_diag.cpp>
